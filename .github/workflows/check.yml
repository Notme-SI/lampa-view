name: Verify plugin
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm test
      - name: Install browser layout checks
        run: |
          npm install --prefix "$RUNNER_TEMP/lampa-browser-check" --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/lampa-browser-check/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Torrent layout
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/torrent-layout.cjs
      - name: Torrent file layout
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/torrent-files-layout.cjs
      - name: Player preload
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/mpvplus-preload.cjs
      - name: Native torrent playback
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/torrent-native-playback.cjs
      - name: Button focus
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/button-focus.cjs
      - name: Episode focus
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/episode-focus.cjs
      - name: Banner proxy
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/hero-proxy.cjs
      - name: TV torrent controls
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/torrent-tv-controls.cjs
      - name: Remote navigation
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/remote-navigation.cjs
      - name: Trakt catalogue
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/trakt-interface.cjs
      - name: Online interface
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/online-polish.cjs
      - name: Watch history and focus
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/history-focus.cjs
      - name: Interface sizes
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/interface-size.cjs
      - name: Poster rails
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/poster-rail.cjs
      - name: Home first screen
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/home-stage.cjs
      - run: python3 server/test-bootstrap.py
      - run: python3 server/test-online.py
      - name: Check published files match source
        run: git diff --exit-code -- lampa.js dist docs

      - name: Check header focus
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/header-focus.cjs
