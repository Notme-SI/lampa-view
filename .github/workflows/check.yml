name: Verify plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm test
      - run: python3 server/test-bootstrap.py
      - run: python3 server/test-online.py
      - name: Check published files match source
        run: git diff --exit-code -- lampa.js dist docs
