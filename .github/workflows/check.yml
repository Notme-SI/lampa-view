name: Verify plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - group: unit
            checks: ""
          - group: playback
            checks: "torrent-layout torrent-files-layout mpvplus-preload torrent-native-playback button-focus episode-focus hero-proxy torrent-tv-controls remote-navigation catalogue-grid project-header trakt-interface"
          - group: online
            checks: "voice-initial online-polish history-focus interface-size poster-rail home-stage header-focus menu-layout search-layout mobile-shell touch-rotation input-selection poster-chrome row-overlay extensions-scroll tv-captions timeline-devices quiet-sync watch-menu"
          - group: catalogue
            checks: "startup-animation artwork-cache torrent-watch-menu appearance-language card-languages home-controls detail-artwork carousel-return detail-gallery tv-shell tv-surfaces catalogue-controls catalogue-metadata catalogue-comments panel-return glass-scene poster-prefetch"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Unit and native-host tests
        if: matrix.group == 'unit'
        run: pnpm test
      - name: Install browser layout checks
        if: matrix.group != 'unit'
        run: |
          npm install --prefix "$RUNNER_TEMP/lampa-browser-check" --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/lampa-browser-check/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Browser checks
        if: matrix.group != 'unit'
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
          CHECKS: ${{ matrix.checks }}
        run: |
          for check in $CHECKS; do
            node "tests/browser/$check.cjs"
          done
