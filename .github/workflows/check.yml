name: Verify plugin
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm test
      - name: Install browser layout checks
        run: |
          npm install --prefix "$RUNNER_TEMP/lampa-browser-check" --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/lampa-browser-check/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Check phone and desktop torrent layout
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: |
          node tests/browser/torrent-layout.cjs
          node tests/browser/torrent-files-layout.cjs
          node tests/browser/mpvplus-preload.cjs
          node tests/browser/torrent-native-playback.cjs
          node tests/browser/button-focus.cjs
          node tests/browser/episode-focus.cjs
          node tests/browser/hero-proxy.cjs
          node tests/browser/torrent-tv-controls.cjs
          node tests/browser/remote-navigation.cjs
          node tests/browser/trakt-interface.cjs
          node tests/browser/online-polish.cjs
          node tests/browser/interface-size.cjs
          node tests/browser/poster-rail.cjs
          node tests/browser/home-stage.cjs
      - run: python3 server/test-bootstrap.py
      - run: python3 server/test-online.py
      - name: Check published files match source
        run: git diff --exit-code -- lampa.js dist docs

      - name: Check header focus
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
        run: node tests/browser/header-focus.cjs
