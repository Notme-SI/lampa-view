name: Verify plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - group: unit
            checks: ""
          - group: playback
            checks: "playback-status torrent-layout torrent-files-layout mpvplus-preload torrent-native-playback button-focus episode-focus hero-proxy torrent-tv-controls remote-navigation catalogue-grid project-header trakt-interface"
          - group: online
            checks: "voice-initial online-polish history-focus interface-size poster-rail poster-responsive home-stage header-focus menu-layout search-layout mobile-shell touch-rotation input-selection poster-chrome row-overlay extensions-scroll tv-captions timeline-devices quiet-sync watch-menu"
          - group: catalogue
            checks: "startup-animation artwork-cache torrent-watch-menu appearance-language card-languages home-controls detail-artwork detail-readable carousel-return detail-gallery detail-suggestions tv-shell tv-surfaces catalogue-controls catalogue-metadata catalogue-comments panel-return glass-scene poster-prefetch"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Unit and native-host tests
        if: matrix.group == 'unit'
        run: |
          if node --test --test-reporter=tap --test-concurrency=2 tests/*.test.cjs > ci-unit.log 2>&1; then
            cat ci-unit.log
          else
            cat ci-unit.log
            node tools/ci-unit-report.cjs ci-unit.log
            exit 1
          fi
      - name: Install browser layout checks
        if: matrix.group != 'unit'
        run: |
          npm install --prefix "$RUNNER_TEMP/lampa-browser-check" --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/lampa-browser-check/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Browser checks
        if: matrix.group != 'unit'
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/lampa-browser-check/node_modules/playwright
          CHECKS: ${{ matrix.checks }}
        run: |
          failed=0
          mkdir -p ci-logs
          for check in $CHECKS; do
            if node "tests/browser/$check.cjs" > "ci-logs/$check.log" 2>&1; then
              cat "ci-logs/$check.log"
            else
              cat "ci-logs/$check.log"
              message=$(tail -c 2500 "ci-logs/$check.log" | tr '\n' ' ')
              echo "::error title=Browser check $check::$message"
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.group != 'unit'
        with:
          name: browser-logs-${{ matrix.group }}
          path: ci-logs/
